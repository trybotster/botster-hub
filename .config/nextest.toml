# cargo-nextest settings, with the values of Core's (botster-core .config/nextest.toml). `cargo xtask test-budget` is the
# entry point.
#
# Default tier: a test over 2 s is terminated and fails; a test that leaves a child holding its output pipes fails
# (leak-timeout). Every profile writes JUnit to target/nextest/<profile>/junit.xml, which the xtask reads for the per-test
# times.

nextest-version = "0.9.100"

[profile.default]
slow-timeout = { period = "2s", terminate-after = 1 }
leak-timeout = { period = "200ms", result = "fail" }
fail-fast = false

[profile.default.junit]
path = "junit.xml"

# CI: same budgets, retries are never allowed (BUILD.md Testing rule 9).
[profile.ci]
inherits = "default"
retries = 0

[profile.ci.junit]
path = "junit.xml"

# The slow tier: real-process tests. No 2 s limit; nextest terminates a test (and its process group) after 600 s.
[profile.slow]
slow-timeout = { period = "60s", terminate-after = 10 }
leak-timeout = { period = "200ms", result = "fail" }
fail-fast = false

[profile.slow.junit]
path = "junit.xml"
