# cargo-nextest settings, with the values of Core's (botster-core .config/nextest.toml). `cargo xtask test-budget` is the
# entry point.
#
# Default tier: a test over 2 s is terminated and fails; a test that leaves a child holding its output pipes fails
# (leak-timeout). Every profile writes JUnit to target/nextest/<profile>/junit.xml, which the xtask reads for the per-test
# times.

nextest-version = "0.9.100"

[profile.default]
slow-timeout = { period = "2s", terminate-after = 1 }
leak-timeout = { period = "200ms", result = "fail" }
fail-fast = false

[profile.default.junit]
path = "junit.xml"

# CI: same budgets, retries are never allowed (BUILD.md Testing rule 9).
[profile.ci]
inherits = "default"
retries = 0

[profile.ci.junit]
path = "junit.xml"

# Mutation runs (the mutants step of `cargo xtask ci`): the default profile, but nextest never terminates a test for its
# time. A mutant that hangs and fails no test must reach the timeout of cargo-mutants and count as TIMEOUT, which fails the
# step; a test that nextest terminated would count as CAUGHT. The step also passes `--max-fail 1:immediate`.
[profile.mutants]
inherits = "default"
slow-timeout = { period = "2s" }
# One retry of a failed test, in this profile only (BUILD.md Testing rule 9): a fail then a pass is FLAKY, nextest passes
# the run, and the mutant counts as MISSED, so a fail-then-pass is no catch. The step names each FLAKY test
# (botster_gate_kit::mutant_logs). Every other profile keeps zero retries.
retries = 1

# The slow tier: real-process tests. No 2 s limit; the xtask enforces the whole-tier deadline.
[profile.slow]
slow-timeout = { period = "60s" }
leak-timeout = { period = "200ms", result = "fail" }
fail-fast = false

[profile.slow.junit]
path = "junit.xml"
