[workspace]
members = [".", "crates/botster-hub-client", "crates/botster-hub-test-support"]

[package]
name = "botster-hub"
version = "0.1.0"
edition = "2024"
description = "Botster first-party host profile over botster-core"
repository = "https://github.com/trybotster/botster-hub"
license-file = "LICENSE"

[dependencies]
botster-hub-client = { path = "crates/botster-hub-client" }
botster-core = { git = "https://github.com/trybotster/botster-core", branch = "main" }
botster-core-daemon = { git = "https://github.com/trybotster/botster-core", branch = "main" }
crossterm = "0.29.0"
mlua = { version = "0.11.6", features = ["lua54", "vendored", "serialize", "send"] }
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
botster-hub-test-support = { path = "crates/botster-hub-test-support" }
