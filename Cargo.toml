[workspace]
members = [
  ".",
  "crates/botster-hub-client",
  "crates/botster-hub-installation",
  "crates/botster-hub-installer",
  "crates/botster-hub-test-support",
  "crates/botster-ui-contract",
]

[package]
name = "botster-hub"
version = "0.1.0"
edition = "2024"
description = "Botster first-party host profile over botster-core"
repository = "https://github.com/trybotster/botster-hub"
license-file = "LICENSE"

[dependencies]
botster-hub-client = { path = "crates/botster-hub-client" }
botster-hub-installation = { path = "crates/botster-hub-installation" }
botster-ui-contract = { path = "crates/botster-ui-contract" }
# Protocol identity and Hub runtime Core share this rev so TerminalFrame stays one crate.
botster-core = { git = "https://github.com/trybotster/botster-core.git", rev = "302c7f7b61f3970a0151b8c6646fc21ae7bd6c67" }
botster-core-daemon = { git = "https://github.com/trybotster/botster-core.git", rev = "302c7f7b61f3970a0151b8c6646fc21ae7bd6c67" }
botster-terminal-protocol = { git = "https://github.com/trybotster/botster-core.git", rev = "302c7f7b61f3970a0151b8c6646fc21ae7bd6c67" }
libc = "0.2.177"
mlua = { version = "0.11.6", features = ["lua54", "vendored", "serialize", "send"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
semver = "1.0.28"
signal-hook = "0.4.4"
shell-words = "1.1.1"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
webrtc = "0.20.0-beta.2"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
async-trait = "0.1.89"
getrandom = "0.3.4"
keyring = "4.1.2"
notify = "8.2.0"

[dev-dependencies]
botster-core-test-support = { git = "https://github.com/trybotster/botster-core.git", rev = "302c7f7b61f3970a0151b8c6646fc21ae7bd6c67" }
botster-terminal-ghostty = { git = "https://github.com/trybotster/botster-core.git", rev = "302c7f7b61f3970a0151b8c6646fc21ae7bd6c67", features = ["libghostty-vt"] }
botster-hub-test-support = { path = "crates/botster-hub-test-support" }
portable-pty = "0.9.0"

# Local development only. Git consumers of hub-client / hub-test-support do not
# inherit this patch; they resolve tag botster-ui-contract-v0.3.2.
[patch."https://github.com/trybotster/botster-hub.git"]
botster-ui-contract = { path = "crates/botster-ui-contract" }
