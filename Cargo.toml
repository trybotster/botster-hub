[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1"
regex = "1"
serde_json = "1"
toml = "0.9"

# botster-contracts, by tag: the Hub's own contract crates (hub, plugin, cli, ui contracts and conformance) follow this tag.
# Core-contract crates (botster-core-contract, botster-fake-core, Core-facing route-codec use) follow the Core rev's tag
# instead, with no [patch] (lead, 2026-10-12): Cargo treats two tags as two crates.
botster-cli-contract = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.50" }
botster-hub-contract = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.50" }
botster-plugin-contract = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.50" }

# The gate code that Core shares (repo plan section 5): a reference by git rev of Core v1, never a copy.
# Moves with the Core rev, not with the Hub contracts pin.
botster-gate-kit = { git = "https://github.com/trybotster/botster-core", rev = "28a29d32d191604221eb4cbeeb02e47371fa3daf" }

# Core v1, by git rev (repo-plan section 3: a pin PR moves it).
botster-core = { git = "https://github.com/trybotster/botster-core", rev = "644f632f194f62ad7fe14e66482ee01083706e30" }
# The route helpers that Core's host and worker share (`terminal_format`, `route_ended_cause`): the same rev as botster-core.
botster-core-link = { git = "https://github.com/trybotster/botster-core", rev = "644f632f194f62ad7fe14e66482ee01083706e30" }
# The client protocol types (HC) and their codec, by the Hub contracts tag; Core's contract follows the Core rev.
botster-route-codec = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.50" }
# The fake Core of botster-contracts, at the tag that the Core rev above pins (contracts-v0.1.46), NOT at the Hub's own
# contracts tag: two tags are two crates, and the fake must implement the same `CoreApi` trait as `botster_core::Core`. It
# moves with the Core pin. The Hub reads the Core contract types only through `botster_core::contract`.
botster-fake-core = { git = "https://github.com/trybotster/botster-contracts", tag = "contracts-v0.1.46" }

data-encoding = "2"
getrandom = "0.4"
# getpeereid on macOS (TB-L3); rustix has SO_PEERCRED for Linux only, and std's peer_cred is unstable.
nix = { version = "0.31", default-features = false, features = ["socket", "user"] }
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
# The constant-time route token compare (TB-L2).
subtle = "2.6"
signal-hook-mio = { version = "0.2", features = ["support-v1_0"] }
tempfile = "3"
