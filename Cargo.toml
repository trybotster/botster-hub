[workspace]
exclude = ["vendor/rtc-0.21.0-rc.1"]
members = [
  ".",
  "crates/botster-hub-client",
  "crates/botster-hub-installation",
  "crates/botster-hub-installer",
  "crates/botster-hub-test-support",
  "crates/botster-plugin-test-kit",
  "crates/botster-ui-contract",
]

[package]
name = "botster-hub"
version = "0.1.0"
edition = "2024"
description = "Botster first-party host profile over botster-core"
repository = "https://github.com/trybotster/botster-hub"
license-file = "LICENSE"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[dependencies]
botster-hub-client = { path = "crates/botster-hub-client" }
botster-hub-installation = { path = "crates/botster-hub-installation" }
botster-ui-contract = { path = "crates/botster-ui-contract" }
# Protocol identity and Hub runtime Core share this rev so TerminalFrame stays one crate.
botster-core = { git = "https://github.com/trybotster/botster-core.git", rev = "8f69957d6a71aa865f1936de248ee7bfed552120" }
botster-core-daemon = { git = "https://github.com/trybotster/botster-core.git", rev = "8f69957d6a71aa865f1936de248ee7bfed552120" }
botster-terminal-protocol = { git = "https://github.com/trybotster/botster-core.git", rev = "8f69957d6a71aa865f1936de248ee7bfed552120" }
botster-terminal-protocol-client = { git = "https://github.com/trybotster/botster-core.git", rev = "8f69957d6a71aa865f1936de248ee7bfed552120" }
libc = "0.2.177"
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs"] }
mlua = { version = "0.11.6", features = ["lua54", "vendored", "serialize", "send"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
sha2 = "=0.11.0"
semver = "1.0.28"
signal-hook = "0.4.4"
shell-words = "1.1.1"
# Reads [package].name of a source-update checkout; already locked through proc-macro-crate.
toml_edit = { version = "=0.25.12", default-features = false, features = ["parse"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
webrtc = "0.21.0-rc.1"
bytes = "1.12.0"
# Locked already through ureq; the MCP HTTP listener parses request heads with it.
httparse = "=1.10.1"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
async-trait = "0.1.89"
getrandom = "0.3.4"
keyring = "4.1.2"
notify = "8.2.0"

[features]
# Test-only entry points over crate-private terminal binding mechanisms.
# Enabled for this crate's own integration tests through the self
# dev-dependency below; production builds never carry it.
test-internals = []
# The plugin test kit: the real daemon driven by a test thread, without
# transports. Used by crates/botster-plugin-test-kit; production builds never
# carry it.
plugin-test-kit = []

[dev-dependencies]
botster-hub = { path = ".", features = ["test-internals"] }
botster-core-test-support = { git = "https://github.com/trybotster/botster-core.git", rev = "8f69957d6a71aa865f1936de248ee7bfed552120", features = ["ghostty-terminal"] }
botster-terminal-ghostty = { git = "https://github.com/trybotster/botster-core.git", rev = "8f69957d6a71aa865f1936de248ee7bfed552120", features = ["libghostty-vt"] }
botster-hub-test-support = { path = "crates/botster-hub-test-support" }
portable-pty = "0.9.0"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7.2"

# Local development only. Git consumers of hub-client / hub-test-support do not
# inherit this patch; they resolve tag botster-ui-contract-v0.3.3.
[patch."https://github.com/trybotster/botster-hub.git"]
botster-ui-contract = { path = "crates/botster-ui-contract" }

# Hub runtime builds use the local rtc repairs documented in vendor/README.md,
# and rtc-sctp (with its sibling rtc-shared, so one copy resolves) from the
# trybotster/rtc fork: upstream 51558ffb plus one commit, branch
# botster/rtc-sctp-stream-reuse-3. That commit lets a stream id be reused only
# after both directions of its reset complete (RFC 8831 section 6.7).
[patch.crates-io]
rtc = { path = "vendor/rtc-0.21.0-rc.1" }
rtc-sctp = { git = "https://github.com/trybotster/rtc", rev = "a96b03c93c648b9abb6214a0adf97ae5c5ca89d1" }
rtc-shared = { git = "https://github.com/trybotster/rtc", rev = "a96b03c93c648b9abb6214a0adf97ae5c5ca89d1" }

# Dev and test builds keep line tables only: panics and backtraces still name
# every frame's file and line, but variable and type debug info (most of the
# DWARF, and most of target/) is dropped. Each writer worktree rebuilds many
# hashed copies of these artifacts, so this scales with every rebuild.
[profile.dev]
debug = "line-tables-only"

# The lifecycle harness verifies the candidate manifest (SHA-256 of the
# ~110 MB Hub binary) on every IsolatedHub start. Unoptimized sha2 takes
# seconds per hash; optimizing only sha2 keeps the same check at a fraction
# of the cost. Release builds are already optimized.
[profile.dev.package.sha2]
opt-level = 3
