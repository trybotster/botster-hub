[package]
name = "botster-plugin-test-kit"
version = "0.1.0"
edition = "2024"
description = "Test Botster Lua plugins against the real Hub plugin runtime"
repository = "https://github.com/trybotster/botster-hub"
license-file = "../../LICENSE"

[dependencies]
botster-hub = { path = "../..", features = ["plugin-test-kit"] }
botster-hub-client = { path = "../botster-hub-client" }
botster-hub-test-support = { path = "../botster-hub-test-support" }
serde = "1.0.228"
serde_json = "1.0.150"
# Same requirement and features as botster-hub: one audited mlua build.
mlua = { version = "=0.11.6", features = ["lua54", "vendored", "serialize", "send"] }
full_moon = { version = "2.2.0", features = ["lua54"] }

[[bin]]
name = "botster-plugin-test"
path = "src/main.rs"

[dev-dependencies]
libc = "0.2.177"
