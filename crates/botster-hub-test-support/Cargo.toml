[package]
name = "botster-hub-test-support"
version = "0.1.0"
edition = "2024"
description = "External-client test harness for isolated botster-hub daemon tests"
repository = "https://github.com/trybotster/botster-hub"
license-file = "../../LICENSE"
include = [
    "Cargo.toml",
    "src/**/*.rs",
    "fixtures/plugin-contract-matrix/**",
    "fixtures/ghostsnp/**",
    "../../LICENSE",
]

[dependencies]
botster-core = { git = "https://github.com/trybotster/botster-core.git", rev = "f4f6bf5babe92dfb9241a760c414187f711c2c42" }
botster-hub-client = { path = "../botster-hub-client" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", tag = "botster-ui-contract-v0.3.2" }
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
# Import-semantic proof for frozen GHOSTSNP late-attach goldens. Same Core pin
# as the workspace lockfile. Requires Zig 0.16.0 for libghostty-vt, matching
# hub session-worker production builds.
botster-terminal-ghostty = { git = "https://github.com/trybotster/botster-core.git", rev = "f4f6bf5babe92dfb9241a760c414187f711c2c42", features = ["libghostty-vt"] }
sha2 = "0.10"
