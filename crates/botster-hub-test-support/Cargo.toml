[package]
name = "botster-hub-test-support"
version = "0.1.0"
edition = "2024"
description = "External-client test harness for isolated botster-hub daemon tests"
repository = "https://github.com/trybotster/botster-hub"
license-file = "../../LICENSE"
include = [
    "Cargo.toml",
    "build.rs",
    "src/**/*.rs",
    "fixtures/plugin-contract-matrix/**",
    "../../LICENSE",
]

[dependencies]
base64 = "0.22.1"
botster-core ={ git = "https://github.com/trybotster/botster-core.git", rev = "347bd99bf7fa59a62975111eedabe2db16479335" }
botster-hub-client = { path = "../botster-hub-client" }
# GHOSTSNP fixture bytes live in the Hub-safe protocol crate's source tree.
# The client crate supplies the scheme 2 input encoder this harness sends as a
# client; the Hub daemon itself never depends on it.
botster-terminal-protocol = { git = "https://github.com/trybotster/botster-core.git", rev = "347bd99bf7fa59a62975111eedabe2db16479335" }
botster-terminal-protocol-client = { git = "https://github.com/trybotster/botster-core.git", rev = "347bd99bf7fa59a62975111eedabe2db16479335" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", tag = "botster-ui-contract-v0.3.3" }
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[build-dependencies]
serde_json = "1.0.150"

[dev-dependencies]
# Import-semantic proof for Core-owned GHOSTSNP late-attach files. Same Core
# pin as the workspace lockfile. Requires Zig 0.16.0 for libghostty-vt,
# matching hub session-worker production builds.
botster-terminal-ghostty = { git = "https://github.com/trybotster/botster-core.git", rev = "347bd99bf7fa59a62975111eedabe2db16479335", features = ["libghostty-vt"] }
sha2 = "0.10"
