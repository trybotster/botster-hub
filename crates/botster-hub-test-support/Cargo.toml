[package]
name = "botster-hub-test-support"
version = "0.1.0"
edition = "2024"
description = "External-client test harness for isolated botster-hub daemon tests"
repository = "https://github.com/trybotster/botster-hub"
license-file = "../../LICENSE"
include = [
    "Cargo.toml",
    "build.rs",
    "src/**/*.rs",
    "fixtures/plugin-contract-matrix/**",
    "../../LICENSE",
]

[dependencies]
botster-core = { git = "https://github.com/trybotster/botster-core.git", rev = "bfba59889f0025173e9fcfb0a0099beea83e07ea" }
botster-hub-client = { path = "../botster-hub-client" }
# Fixture bytes live in this Hub-safe crate's source tree. Do not depend on
# botster-terminal-protocol-client.
botster-terminal-protocol = { git = "https://github.com/trybotster/botster-core.git", rev = "bfba59889f0025173e9fcfb0a0099beea83e07ea" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", tag = "botster-ui-contract-v0.3.3" }
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[build-dependencies]
serde_json = "1.0.150"

[dev-dependencies]
# Import-semantic proof for Core-owned GHOSTSNP late-attach files. Same Core
# pin as the workspace lockfile. Requires Zig 0.16.0 for libghostty-vt,
# matching hub session-worker production builds.
botster-terminal-ghostty = { git = "https://github.com/trybotster/botster-core.git", rev = "bfba59889f0025173e9fcfb0a0099beea83e07ea", features = ["libghostty-vt"] }
sha2 = "0.10"
