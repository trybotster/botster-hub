[package]
name = "botster-ui-contract"
version = "0.3.2"
edition = "2024"
description = "Renderer-neutral Botster plugin UI contract"
repository = "https://github.com/trybotster/botster-hub"
license-file = "../../LICENSE"
readme = "README.md"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[dev-dependencies]
jsonschema = { version = "0.49.2", default-features = false }
