[package]
name = "botster-hub-client"
version = "0.1.0"
edition = "2024"
description = "Reusable Botster hub daemon client protocol and socket helpers"
repository = "https://github.com/trybotster/botster-hub"
license-file = "../../LICENSE"

[dependencies]
base64 = "0.22.1"
botster-terminal-protocol = { git = "https://github.com/trybotster/botster-core.git", rev = "bf6e7d996bca2786ad4142c870a13c57a490e241" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", tag = "botster-ui-contract-v0.3.3" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
