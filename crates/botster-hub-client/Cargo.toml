[package]
name = "botster-hub-client"
version = "0.1.0"
edition = "2024"
description = "Reusable Botster hub daemon client protocol and socket helpers"
repository = "https://github.com/trybotster/botster-hub"
license-file = "../../LICENSE"

[dependencies]
base64 = "0.22.1"
botster-terminal-protocol = { git = "https://github.com/trybotster/botster-core.git", rev = "f4f6bf5babe92dfb9241a760c414187f711c2c42" }
botster-ui-contract = { git = "https://github.com/trybotster/botster-hub.git", tag = "botster-ui-contract-v0.3.2" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
