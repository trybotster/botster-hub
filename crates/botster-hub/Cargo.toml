[package]
name = "botster-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The v1 Hub daemon (repo plan section 3): data dir and flock singleton, one owner of the embedded Core behind a bounded
# bridge, the client protocol server, plugin management through Core's managed-process ops. The bin `botster-hub` comes
# with the daemon. HIGH paths (ci/high-tier-paths.txt): process control, identity and the durable store.

[lints]
workspace = true

[dependencies]
botster-hub-contract.workspace = true
botster-plugin-contract.workspace = true
botster-route-codec.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true

# The peer uid (TB-L3): SO_PEERCRED on Linux, getpeereid on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["net"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix.workspace = true

[dev-dependencies]
tempfile.workspace = true
