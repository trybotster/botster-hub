[package]
name = "botster-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The workspace's lint table, copied with exactly one difference (lead ruling 2026-10-12, HC HS-0 `--ready-fd`):
# `unsafe_code` is "deny", not "forbid", so that exactly one item may allow it: `take_ready_fd` in src/main.rs (the gate-kit
# Policy exceptions list it). The gate-kit rule refuses any other `unsafe_code` identifier, so no other item can allow it.
[lints.rust]
unsafe_code = "deny"

[dependencies]
botster-core.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
mio.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
signal-hook-mio.workspace = true
toml.workspace = true

[dev-dependencies]
botster-fake-core.workspace = true
tempfile.workspace = true
