name: Loaded daemon lifecycle diagnostics

on:
  workflow_dispatch:
    inputs:
      subject_sha:
        description: Full 40-character commit SHA to test
        required: true
        type: string
      test_target:
        description: Test surface (focused runs do not satisfy broader acceptance campaigns)
        required: true
        default: lifecycle-suite
        type: choice
        options:
          - lifecycle-suite
          - focused-metadata-owned-shutdown
          - focused-occupied-web-port
          - focused-session-entity-resize
          - focused-process-ownership
          - focused-connection-lifecycle
          - focused-plugin-resource-bounds
          - focused-stalled-attach
          - focused-fast-exit-attach-diagnostic
          - focused-oversized-webrtc
          - focused-cli-smoke
          - focused-operator-console
          - focused-lua-worker-suite
          - focused-lua-session-worker-callers
          - event-plane-saturation
          - full-suite-contention
      repetitions:
        description: Number of repetitions (1-100)
        required: true
        default: 20
        type: number
      stress_profile:
        description: Bounded job-local CPU stress profile
        required: true
        default: residual-tail
        type: choice
        options:
          - residual-tail
          - moderate
          - none
      event_plane_phase:
        description: Event-plane saturation phase. Ignored for other test targets. Calibration writes the dataset; acceptance gates against the committed dataset.
        required: true
        default: calibration
        type: choice
        options:
          - calibration
          - acceptance
      event_plane_calibration_commit:
        description: Full SHA of the commit that contains the calibration JSON. Required when event_plane_phase is acceptance.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: loaded-daemon-lifecycle-diagnostics
  cancel-in-progress: false

jobs:
  loaded-daemon-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/loaded-daemon-lifecycle-artifacts
      BOTSTER_LOADED_CAMPAIGN_TIMEOUT_SECONDS: "19800"
      BOTSTER_LOADED_RUN_TIMEOUT_SECONDS: "900"
    steps:
      - name: Check out workflow harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: workflow-harness
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate bounded inputs
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
          REPETITIONS: ${{ inputs.repetitions }}
          TEST_TARGET: ${{ inputs.test_target }}
          STRESS_PROFILE: ${{ inputs.stress_profile }}
          EVENT_PLANE_PHASE: ${{ inputs.event_plane_phase }}
          EVENT_PLANE_CALIBRATION_COMMIT: ${{ inputs.event_plane_calibration_commit }}
        run: |
          if [[ "$TEST_TARGET" == event-plane-saturation ]]; then
            export BOTSTER_EVENT_PLANE_PHASE="$EVENT_PLANE_PHASE"
            if [[ -n "$EVENT_PLANE_CALIBRATION_COMMIT" ]]; then
              export BOTSTER_EVENT_PLANE_CALIBRATION_COMMIT="$EVENT_PLANE_CALIBRATION_COMMIT"
            fi
          fi
          workflow-harness/script/run-loaded-daemon-lifecycle \
            --validate-only \
            --artifact-dir "$ARTIFACT_DIR" \
            --subject-sha "$SUBJECT_SHA" \
            --test-target "$TEST_TARGET" \
            --repetitions "$REPETITIONS" \
            --stress-profile "$STRESS_PROFILE"

      - name: Validate lifecycle survivor predicates
        run: |
          workflow-harness/script/run-loaded-daemon-lifecycle-selftest 2>&1 \
            | tee "$ARTIFACT_DIR/runner-selftest.log"

      - name: Check out exact subject commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: subject
          ref: ${{ inputs.subject_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact subject commit
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
        run: |
          resolved_sha="$(git -C subject rev-parse HEAD)"
          printf 'requested_sha=%s\nresolved_sha=%s\n' "$SUBJECT_SHA" "$resolved_sha" | tee -a "$ARTIFACT_DIR/metadata.txt"
          if [[ "$resolved_sha" != "$SUBJECT_SHA" ]]; then
            printf 'subject checkout mismatch\n' | tee -a "$ARTIFACT_DIR/metadata.txt"
            exit 1
          fi

      - name: Install pinned Zig toolchain
        # botster-terminal-ghostty's libghostty-vt build requires Zig 0.16.0
        # (exact pin; matches botster-core ghostty bump / GHOSTTY_SHA build path).
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          {
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'runner_image=%s\n' "${ImageOS:-unknown} ${ImageVersion:-unknown}"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'cpu_count=%s\n' "$(nproc)"
            rustc --version
            cargo --version
            rustup show active-toolchain
            zig version
            uname -a
          } | tee -a "$ARTIFACT_DIR/metadata.txt"

      - name: Precompile selected test surface
        working-directory: subject
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
          TEST_TARGET: ${{ inputs.test_target }}
        run: |
          case "$TEST_TARGET" in
            focused-lua-worker-suite|focused-lua-session-worker-callers)
              test_args=(--test hub_lua_runtime_test --no-run)
              ;;
            full-suite-contention)
              test_args=(--no-run)
              ;;
            *)
              test_args=(--test hub_daemon_lifecycle_test --no-run)
              ;;
          esac
          printf 'precompile_args=' | tee -a "$ARTIFACT_DIR/metadata.txt"
          printf '%q ' "${test_args[@]}" | tee -a "$ARTIFACT_DIR/metadata.txt"
          printf '\n' | tee -a "$ARTIFACT_DIR/metadata.txt"
          ./test.sh "${test_args[@]}" 2>&1 \
            | tee "$ARTIFACT_DIR/precompile.log"
          worker_args=(build --locked -p botster-core-daemon --bin botster-session-worker)
          printf 'worker_precompile_args=cargo ' | tee -a "$ARTIFACT_DIR/metadata.txt"
          printf '%q ' "${worker_args[@]}" | tee -a "$ARTIFACT_DIR/metadata.txt"
          printf '\n' | tee -a "$ARTIFACT_DIR/metadata.txt"
          cargo "${worker_args[@]}" 2>&1 \
            | tee -a "$ARTIFACT_DIR/precompile.log"
          hub_bin="$GITHUB_WORKSPACE/subject/target/debug/botster-hub"
          worker_bin="$GITHUB_WORKSPACE/subject/target/debug/botster-session-worker"
          if [[ ! -x "$hub_bin" || ! -x "$worker_bin" ]]; then
            printf 'missing precompiled runtime binary: hub=%s worker=%s\n' "$hub_bin" "$worker_bin" \
              | tee -a "$ARTIFACT_DIR/metadata.txt"
            exit 1
          fi
          target_realpath="$(realpath "$GITHUB_WORKSPACE/subject/target")"
          hub_realpath="$(realpath "$hub_bin")"
          worker_realpath="$(realpath "$worker_bin")"
          for runtime_realpath in "$hub_realpath" "$worker_realpath"; do
            case "$runtime_realpath" in
              "$target_realpath"/*) ;;
              *)
                printf 'runtime binary escaped fresh target: %s\n' "$runtime_realpath" \
                  | tee -a "$ARTIFACT_DIR/metadata.txt"
                exit 1
                ;;
            esac
          done
          locked_core_sha="$(
            sed -n '/name = "botster-core"/,/^$/p' Cargo.lock \
              | sed -n 's/^source = "git+[^#]*#\([0-9a-f]\{40\}\)"$/\1/p' \
              | head -n 1
          )"
          if [[ ! "$locked_core_sha" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'unable to resolve locked botster-core SHA\n' \
              | tee -a "$ARTIFACT_DIR/metadata.txt"
            exit 1
          fi
          {
            printf 'hub_sha=%s\n' "$SUBJECT_SHA"
            printf 'locked_core_sha=%s\n' "$locked_core_sha"
            printf 'target_realpath=%s\n' "$target_realpath"
            printf 'hub_bin_realpath=%s\n' "$hub_realpath"
            printf 'session_worker_bin_realpath=%s\n' "$worker_realpath"
          } | tee -a "$ARTIFACT_DIR/metadata.txt"

      - name: Run loaded real-daemon lifecycle campaign
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
          REPETITIONS: ${{ inputs.repetitions }}
          TEST_TARGET: ${{ inputs.test_target }}
          STRESS_PROFILE: ${{ inputs.stress_profile }}
          EVENT_PLANE_PHASE: ${{ inputs.event_plane_phase }}
          EVENT_PLANE_CALIBRATION_COMMIT: ${{ inputs.event_plane_calibration_commit }}
        run: |
          if [[ "$TEST_TARGET" == event-plane-saturation ]]; then
            export BOTSTER_LOADED_RUN_TIMEOUT_SECONDS=3600
            export BOTSTER_EVENT_PLANE_PHASE="$EVENT_PLANE_PHASE"
            export BOTSTER_EVENT_PLANE_ARTIFACT_DIR="$ARTIFACT_DIR"
            export SUBJECT_SHA="$SUBJECT_SHA"
            if [[ "$EVENT_PLANE_PHASE" == calibration ]]; then
              export BOTSTER_EVENT_PLANE_COMMIT_CALIBRATION=1
            fi
            if [[ "$EVENT_PLANE_PHASE" == acceptance ]]; then
              export BOTSTER_EVENT_PLANE_CALIBRATION_COMMIT="$EVENT_PLANE_CALIBRATION_COMMIT"
            fi
          fi
          workflow-harness/script/run-loaded-daemon-lifecycle \
            --subject-dir "$GITHUB_WORKSPACE/subject" \
            --artifact-dir "$ARTIFACT_DIR" \
            --subject-sha "$SUBJECT_SHA" \
            --test-target "$TEST_TARGET" \
            --repetitions "$REPETITIONS" \
            --stress-profile "$STRESS_PROFILE"

      - name: Retain event-plane calibration or acceptance dataset
        if: ${{ always() && inputs.test_target == 'event-plane-saturation' }}
        run: |
          dataset="$ARTIFACT_DIR/event-plane-saturation-${{ inputs.event_plane_phase }}.json"
          if [[ ! -s "$dataset" ]]; then
            printf 'missing event-plane %s dataset: %s\n' \
              "${{ inputs.event_plane_phase }}" "$dataset" \
              | tee -a "$ARTIFACT_DIR/metadata.txt"
            exit 1
          fi
          {
            printf 'event_plane_phase=%s\n' "${{ inputs.event_plane_phase }}"
            printf 'event_plane_dataset=%s\n' "$dataset"
            printf 'event_plane_dataset_bytes=%s\n' "$(wc -c < "$dataset")"
          } | tee -a "$ARTIFACT_DIR/metadata.txt"
          if [[ "${{ inputs.event_plane_phase }}" == calibration ]]; then
            printf 'event_plane_reference_commit=download this artifact and commit docs/reports/prove-the-event-plane-cannot-lag-or-block-hub-operations-calibration.json before acceptance\n' \
              | tee -a "$ARTIFACT_DIR/metadata.txt"
          fi

      - name: Enforce owned-process teardown
        if: ${{ always() }}
        run: |
          if [[ -x workflow-harness/script/run-loaded-daemon-lifecycle ]]; then
            workflow-harness/script/run-loaded-daemon-lifecycle \
              --cleanup-only \
              --artifact-dir "$ARTIFACT_DIR"
          fi

      - name: Upload complete diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loaded-daemon-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14
